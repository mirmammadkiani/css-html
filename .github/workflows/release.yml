name: Automated Release Build

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'نام نسخه (مثلاً v1.0.0) - در صورت خالی بودن خودکار ساخته می‌شود'
        required: false
        type: string
        default: ''
      publish_release:
        description: 'انتشار خودکار در صفحه Releases گیت‌هاب'
        required: false
        type: boolean
        default: true
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check signing secrets
        id: secrets_check
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.ref_type }}" = "tag" ]; then
              echo "::error::لطفاً سه مقدار KEYSTORE_BASE64، STORE_PASSWORD و KEY_PASSWORD را در GitHub Secrets ثبت کنید."
              exit 1
            else
              echo "::warning::Secrets امضای ریلیز هنوز در تنظیمات گیت‌هاب ثبت نشده‌اند؛ مرحله ساخت ریلیز رد شد."
            fi
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.secrets_check.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        if: steps.secrets_check.outputs.ready == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode release keystore
        if: steps.secrets_check.outputs.ready == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > my-upload-key.jks

      - name: Accept Android SDK licenses
        if: steps.secrets_check.outputs.ready == 'true'
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Build signed Release APK and AAB
        if: steps.secrets_check.outputs.ready == 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease :app:bundleRelease

      - name: Clean up keystore file
        if: always()
        run: rm -f my-upload-key.jks

      - name: Prepare release assets
        if: steps.secrets_check.outputs.ready == 'true'
        id: meta
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION_TAG="${GITHUB_REF_NAME}"
          elif [ -n "$INPUT_TAG_NAME" ]; then
            VERSION_TAG="$INPUT_TAG_NAME"
          else
            APP_VER=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
            APP_VER=${APP_VER:-1.0}
            VERSION_TAG="v${APP_VER}.${GITHUB_RUN_NUMBER}"
          fi

          echo "tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          mkdir -p release-assets

          APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          AAB_SRC=$(find app/build/outputs/bundle/release -name "*.aab" | head -n1)

          cp "$APK_SRC" "release-assets/webforus-${VERSION_TAG}.apk"
          cp "$AAB_SRC" "release-assets/webforus-${VERSION_TAG}.aab"

      - name: Upload build artifacts
        if: steps.secrets_check.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: webforus-${{ steps.meta.outputs.tag }}
          path: release-assets/*

      - name: Publish GitHub Release
        if: >
          steps.secrets_check.outputs.ready == 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.publish_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "webforus ${{ steps.meta.outputs.tag }}"
          generate_release_notes: true
          files: |
            release-assets/*.apk
            release-assets/*.aab
